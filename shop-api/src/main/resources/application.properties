spring.application.name=shop-api

# ใช้พอร์ต 8081 จะได้รันพร้อมกับโปรเจค demo (8080) ได้
server.port=8081

# อ่านรหัสผ่านจากไฟล์ .env (ไฟล์นี้ถูก .gitignore ไว้ ไม่ขึ้น GitHub)
spring.config.import=optional:file:.env[.properties]

# createDatabaseIfNotExist=true → ถ้ายังไม่มี database ชื่อ shopdb ให้สร้างให้อัตโนมัติ
spring.datasource.url=jdbc:mysql://localhost:3306/shopdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ปิด Open Session In View: บังคับให้โหลดข้อมูลให้ครบใน Service (แนวปฏิบัติที่ดี)
spring.jpa.open-in-view=false

# จำกัดขนาดหน้าสูงสุด กัน client ขอ size=1000000
spring.data.web.pageable.max-page-size=50
